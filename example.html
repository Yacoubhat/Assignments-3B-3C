<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connected Scatter Plot</title>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .axis-label {
            font-size: 14px;
            font-weight: bold;
        }

        .country-line {
            fill: none;
            stroke-width: 2.5;
            opacity: 0.75;
        }

        .point {
            stroke: white;
            stroke-width: 1;
        }

        .tooltip {
            position: absolute;
            background: white;
            border: 1px solid #aaa;
            padding: 8px;
            border-radius: 5px;
            pointer-events: none;
            font-size: 13px;
            opacity: 0;
        }
    </style>
</head>

<body>

<h2>Health Expenditure vs Life Expectancy</h2>
<p>How has each country's health expenditure and life expectancy changed over time?</p>
<p>The lines show the movement of each country over the years.</p>

<div id="chart"></div>
<div class="tooltip"></div>

<script>

const width = 900;
const height = 600;

const margin = {
    top: 40,
    right: 150,
    bottom: 70,
    left: 80
};

const svg = d3.select("#chart")
    .append("svg")
    .attr("width", width)
    .attr("height", height);

const chartWidth =
    width - margin.left - margin.right;

const chartHeight =
    height - margin.top - margin.bottom;

const chart = svg.append("g")
    .attr(
        "transform",
        `translate(${margin.left},${margin.top})`
    );

const tooltip = d3.select(".tooltip");


// -----------------------------------------------------
// LOAD DATA
// -----------------------------------------------------

d3.csv("data/health_data_merged.csv").then(data => {

    // Convert strings from CSV into numbers
    data.forEach(d => {

        d.Year = +d.Year;

        d.expenditure =
            +d["Health Expenditure Share of ppp per capita"];

        d.lifeExpectancy =
            +d["Life Expectancy"];

    });


    // -------------------------------------------------
    // SELECT COUNTRIES
    // -------------------------------------------------

    const selectedCountryCodes = ['ARG', 'AUS', 'AUT', 'BEL', 'BRA', 'BGR', 'CAN', 'CHL', 'CHN', 'COL', 'CRI',
 'HRV', 'CZE', 'DNK', 'EST', 'FIN', 'FRA', 'DEU', 'GRC', 'HUN', 'ISL', 'IND',
 'IDN', 'IRL', 'ISR', 'ITA', 'JPN', 'KOR', 'LVA', 'LTU', 'LUX', 'MEX', 'NLD',
 'NZL', 'NOR', 'PER', 'POL', 'PRT', 'ROU', 'SVK', 'SVN', 'ZAF', 'ESP', 'SWE',
 'CHE', 'THA', 'TUR', 'UKR', 'GBR', 'USA']
        

    const filteredData = data.filter(d =>
        selectedCountryCodes.includes(d["Country Code"])
    );


    // -------------------------------------------------
    // GROUP BY COUNTRY
    // -------------------------------------------------

    const groupedData =
        d3.group(filteredData, d => d.Country);


    // VERY IMPORTANT:
    // Sort each country's observations chronologically.
    groupedData.forEach(values => {
        values.sort((a, b) => a.Year - b.Year);
    });


    // -------------------------------------------------
    // X SCALE
    // Health expenditure
    // -------------------------------------------------

    const x = d3.scaleLinear()
        .domain(
            d3.extent(
                filteredData,
                d => d.expenditure
            )
        )
        .nice()
        .range([0, chartWidth]);


    // -------------------------------------------------
    // Y SCALE
    // Life expectancy
    // -------------------------------------------------

    const y = d3.scaleLinear()
        .domain(
            d3.extent(
                filteredData,
                d => d.lifeExpectancy
            )
        )
        .nice()
        .range([chartHeight, 0]);


    // -------------------------------------------------
    // COLOUR SCALE
    // -------------------------------------------------

    const colour = d3.scaleOrdinal()
        .domain(selectedCountries)
        .range(d3.schemeTableau10);


    // -------------------------------------------------
    // AXES
    // -------------------------------------------------

    chart.append("g")
        .attr(
            "transform",
            `translate(0,${chartHeight})`
        )
        .call(d3.axisBottom(x));


    chart.append("g")
        .call(d3.axisLeft(y));


    // -------------------------------------------------
    // X AXIS LABEL
    // -------------------------------------------------

    svg.append("text")
        .attr(
            "x",
            margin.left + chartWidth / 2
        )
        .attr(
            "y",
            height - 20
        )
        .attr("text-anchor", "middle")
        .attr("class", "axis-label")
        .text(
            "Health Expenditure (PPP per capita)"
        );


    // -------------------------------------------------
    // Y AXIS LABEL
    // -------------------------------------------------

    svg.append("text")
        .attr(
            "transform",
            "rotate(-90)"
        )
        .attr(
            "x",
            -(margin.top + chartHeight / 2)
        )
        .attr(
            "y",
            20
        )
        .attr("text-anchor", "middle")
        .attr("class", "axis-label")
        .text("Life Expectancy (Years)");


    // -------------------------------------------------
    // LINE GENERATOR
    // -------------------------------------------------

    const line = d3.line()
        .x(d => x(d.expenditure))
        .y(d => y(d.lifeExpectancy));


    // -------------------------------------------------
    // DRAW ONE TRAJECTORY PER COUNTRY
    // -------------------------------------------------

    groupedData.forEach(
        (countryData, country) => {

            chart.append("path")
                .datum(countryData)
                .attr("class", "country-line")
                .attr("stroke", colour(country))
                .attr("d", line);

        }
    );


    // -------------------------------------------------
    // DRAW YEARLY OBSERVATIONS
    // -------------------------------------------------

    chart.selectAll(".point")
        .data(filteredData)
        .enter()
        .append("circle")

        .attr("class", "point")

        .attr(
            "cx",
            d => x(d.expenditure)
        )

        .attr(
            "cy",
            d => y(d.lifeExpectancy)
        )

        .attr("r", 4)

        .attr(
            "fill",
            d => colour(d.Country)
        )


        // ---------------------------------------------
        // TOOLTIP
        // ---------------------------------------------

        .on("mouseover", function(event, d) {

            d3.select(this)
                .attr("r", 7);

            tooltip
                .style("opacity", 1)
                .html(`
                    <strong>${d.Country}</strong><br>
                    Year: ${d.Year}<br>
                    Expenditure:
                    ${d.expenditure.toFixed(2)}<br>
                    Life expectancy:
                    ${d.lifeExpectancy.toFixed(1)}
                `);

        })

        .on("mousemove", function(event) {

            tooltip
                .style(
                    "left",
                    event.pageX + 15 + "px"
                )
                .style(
                    "top",
                    event.pageY - 20 + "px"
                );

        })

        .on("mouseout", function() {

            d3.select(this)
                .attr("r", 4);

            tooltip
                .style("opacity", 0);

        });


    // -------------------------------------------------
    // LABEL EACH COUNTRY AT ITS MOST RECENT POINT
    // -------------------------------------------------

    groupedData.forEach(
        (countryData, country) => {

            const lastPoint =
                countryData[countryData.length - 1];

            chart.append("text")

                .attr(
                    "x",
                    x(lastPoint.expenditure) + 7
                )

                .attr(
                    "y",
                    y(lastPoint.lifeExpectancy)
                )

                .attr(
                    "fill",
                    colour(country)
                )

                .attr("font-size", 12)

                .text(country);

        }
    );

});

</script>

</body>
</html>
